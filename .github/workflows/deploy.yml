name: Deploya appen

# Varje push till main: stämpla versionen automatiskt och publicera till GitHub Pages.
# Ingen manuell versionsbump behövs — versionen blir 1.3.<antal commits>.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stämpla version i appen och service workern
        run: |
          VERSION="1.3.$(git rev-list --count HEAD)"
          echo "Version: $VERSION"
          sed -i "s/window.APP_VERSION = '[^']*'/window.APP_VERSION = '$VERSION'/" js/version.js
          sed -i "s/const VERSION = '[^']*'/const VERSION = '$VERSION'/" sw.js
          grep APP_VERSION js/version.js
          grep "const VERSION" sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
